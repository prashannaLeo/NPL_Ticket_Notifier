[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "npl-ticket-notifier"
version = "1.0.0"
description = "Real-time Khalti events API monitoring with Telegram notifications"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "NPL Ticket Notifier Team"},
]
keywords = ["npl", "khalti", "tickets", "telegram", "notification", "monitoring"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications",
    "Topic :: Internet",
]

dependencies = [
    "requests>=2.28.0",
    "python-dotenv>=0.20.0",
    "urllib3>=2.0.0",
    "gtts>=2.4.0",
    "flask>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "flake8>=6.0",
    "mypy>=1.0",
]

[project.scripts]
npl-monitor = "npl_notifier.scripts.monitor:main"
npl-check = "npl_notifier.scripts.check:main"

[project.urls]
Homepage = "https://github.com/prasannadhami14/NPL_Ticket_Notifier"
Documentation = "https://github.com/prasannadhami14/NPL_Ticket_Notifier#readme"
Repository = "https://github.com/prasannadhami14/NPL_Ticket_Notifier.git"
"Bug Tracker" = "https://github.com/prasannadhami14/NPL_Ticket_Notifier/issues"

[tool.setuptools]
packages = ["npl_notifier"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = false
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["npl_notifier/tests"]
