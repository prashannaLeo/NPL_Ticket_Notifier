name: Deploy NPL Ticket Notifier

on:
  push:
    branches:
      - main
      - master
  schedule:
    # Run the notifier every 60 seconds throughout the day
    - cron: '* * * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  check-tickets:
    runs-on: ubuntu-latest
    timeout-minutes: 55  # Stop before GitHub's 60-minute limit for scheduled jobs
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history to access notified_tickets.json
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download previous ticket history
        continue-on-error: true
        run: |
          git fetch origin main 2>/dev/null || true
          git show origin/main:notified_tickets.json > notified_tickets.json 2>/dev/null || echo "[]" > notified_tickets.json
          echo "✓ Loaded previous ticket history"

      - name: Run ticket notifier check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KHALTI_EVENT_ID: ${{ secrets.KHALTI_EVENT_ID }}
        run: |
          python run_check.py

      - name: Commit ticket history
        run: |
          git config user.email "github-actions@bot.local"
          git config user.name "GitHub Actions"
          git add -f notified_tickets.json
          if git diff --cached --quiet; then
            echo "No changes to history"
          else
            git commit -m "Update ticket history [skip ci]"
            git push origin main
          fi
        continue-on-error: true

      - name: Log results
        if: always()
        run: |
          echo "Ticket check completed at $(date)" | tee deploy_log.txt
          echo "Next check in 60 seconds (GitHub Actions scheduling)" >> deploy_log.txt

      - name: Upload deployment logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-logs-${{ github.run_number }}
          path: deploy_log.txt
          retention-days: 7
