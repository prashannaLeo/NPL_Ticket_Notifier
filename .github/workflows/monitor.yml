name: Monitor NPL Tickets

on:
  schedule:
    # Run every 1 minute for faster detection
    - cron: '*/1 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Download previous ticket history
      continue-on-error: true
      run: |
        git fetch origin main 2>/dev/null || true
        git show origin/main:notified_tickets.json > notified_tickets.json 2>/dev/null || echo "[]" > notified_tickets.json
        
    - name: Run ticket checker
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        KHALTI_EVENT_ID: ${{ secrets.KHALTI_EVENT_ID }}
      run: python run_check.py
      
    - name: Commit and push updated history
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add notified_tickets.json
        git commit -m "Update ticket history - $(date)" || true
        git push origin main || true
      continue-on-error: true
      
    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: check-logs
        path: check_log.txt
        retention-days: 7
