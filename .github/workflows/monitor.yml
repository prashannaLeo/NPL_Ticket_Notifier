name: Continuous Ticket Monitoring

on:
  schedule:
    # Run every 1 minutes for more frequent checks
    - cron: '*/1 * * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download previous ticket history
        continue-on-error: true
        run: |
          if git log --all --oneline -- notified_tickets.json | head -1; then
            git show HEAD:notified_tickets.json > notified_tickets.json 2>/dev/null || true
            echo "✓ Loaded previous ticket history"
          else
            echo "ℹ️  No previous history found (first run)"
          fi

      - name: Check for available tickets
        id: check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KHALTI_EVENT_ID: ${{ secrets.KHALTI_EVENT_ID }}
        run: |
          python run_check.py

      - name: Commit ticket history
        continue-on-error: true
        run: |
          git config user.email "github-actions@bot.local"
          git config user.name "GitHub Actions"
          git add notified_tickets.json || true
          git commit -m "Update ticket history [skip ci]" || true

      - name: Push ticket history
        continue-on-error: true
        run: |
          git push origin main || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-logs-${{ github.run_number }}
          path: check_log.txt
          retention-days: 7
