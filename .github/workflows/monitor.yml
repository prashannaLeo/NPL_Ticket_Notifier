name: Monitor NPL Tickets

on:
  schedule:
    # Run every 1 minute for faster detection
    - cron: '*/1 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Download previous ticket history
      continue-on-error: true
      run: |
        git fetch origin main 2>/dev/null || true
        git show origin/main:notified_tickets.json > notified_tickets.json 2>/dev/null || echo "[]" > notified_tickets.json
        ls -la notified_tickets.json
        
    - name: Run ticket checker
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        KHALTI_EVENT_ID: ${{ secrets.KHALTI_EVENT_ID }}
      run: python run_check.py
      
    - name: Commit and push updated history
      run: |
        git config --local user.email "github-actions@bot.local"
        git config --local user.name "GitHub Actions"
        git add -f notified_tickets.json
        if git diff --cached --quiet; then
          echo "No changes to history"
        else
          git commit -m "Update ticket history [skip ci]"
          git push origin main
        fi
      continue-on-error: true
      
    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: check-logs-${{ github.run_number }}
        path: check_log.txt
        retention-days: 7
